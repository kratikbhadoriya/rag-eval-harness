name: Eval
on:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models
          key: onnx-all-MiniLM-L6-v2
      - uses: actions/cache@v4
        with:
          path: .chroma
          key: chroma-${{ hashFiles('data/corpus/**', 'src/rageval/ingest.py', 'src/rageval/embed.py') }}
      - run: make ingest
      - run: make eval SAMPLE=30
      - name: Gate
        run: make gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            results.md
